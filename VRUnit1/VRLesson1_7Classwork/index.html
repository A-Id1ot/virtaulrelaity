<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-entity>
        <a-sphere position="0 1 -4" rotation="-65 180 -90" color="rgb(252, 234, 63)" phi-length="315" theta-length="180" side="double"></a-sphere>
        <a-sphere position="0 1 -4" rotation="-65 180 -90" color="black" phi-length="315" theta-length="180" side="double" radius="0.990"></a-sphere>
      </a-entity>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
